<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Painel de Controle - Página 1</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 48rem;
            margin: 0 auto;
            padding: 2rem;
            background: #f1f5f9;
            color: #172033;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        h1 {
            font-size: clamp(1.75rem, 5vw, 2.5rem);
            text-align: center;
        }

        hr {
            margin: 1.5rem 0;
            border: 0;
            border-top: 1px solid #cbd5e1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 8px 24px rgb(15 23 42 / 8%);
        }

        th, td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: #fff;
        }

        tr:nth-child(even) td {
            background: #f8fafc;
        }

        a {
            color: #1d4ed8;
        }

        a:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }
    </style>
</head>
