<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-content: center;
            gap: 1rem;
            padding: 2rem;
            background: #f1f5f9;
            color: #172033;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: clamp(2rem, 5vw, 3rem);
            text-align: center;
        }

        .panel-photo {
            width: min(100%, 24rem);
            aspect-ratio: 16 / 9;
            border-radius: 1rem;
            object-fit: cover;
            box-shadow: 0 12px 30px rgb(15 23 42 / 12%);
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            color: #475569;
            font-weight: 600;
        }

        .status::before {
            width: 0.7rem;
            height: 0.7rem;
            border-radius: 50%;
            background: #64748b;
            content: "";
        }

        .status.is-running {
            color: #15803d;
        }

        .status.is-running::before {
            background: #22c55e;
            box-shadow: 0 0 0 4px #dcfce7;
        }

        .timer {
            margin: 0;
            color: #172033;
            font-size: 2rem;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            text-align: center;
        }

        button {
            min-width: 12rem;
            padding: 0.85rem 1.25rem;
            border: 0;
            border-radius: 0.75rem;
            background: #2563eb;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 150ms ease, transform 150ms ease;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        button:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        button:nth-of-type(2) {
            background: #dc2626;
        }

        button:nth-of-type(2):hover {
            background: #b91c1c;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        hr {
            width: 100%;
            margin: 0.5rem 0 0;
            border: 0;
            border-top: 1px solid #cbd5e1;
        }

        @media (prefers-reduced-motion: reduce) {
            button {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <h1>Painel de Controle</h1>
    <img
        class="panel-photo"
        src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=960&q=80"
        alt="Placa eletrônica com circuitos"
    >
    <p class="status" id="status" role="status" aria-live="polite">Parado</p>
    <p class="timer" id="timer">00:00</p>
    <button id="start" type="button">Iniciar</button>
    <button id="stop" type="button" disabled>Parar</button>
    <hr>

    <script>
        const status = document.querySelector("#status");
        const timer = document.querySelector("#timer");
        const startButton = document.querySelector("#start");
        const stopButton = document.querySelector("#stop");
        let elapsedSeconds = 0;
        let intervalId = null;

        function updateTimer() {
            const minutes = Math.floor(elapsedSeconds / 60).toString().padStart(2, "0");
            const seconds = (elapsedSeconds % 60).toString().padStart(2, "0");
            timer.textContent = `${minutes}:${seconds}`;
        }

        startButton.addEventListener("click", () => {
            status.textContent = "Em funcionamento";
            status.classList.add("is-running");
            startButton.disabled = true;
            stopButton.disabled = false;
            intervalId = window.setInterval(() => {
                elapsedSeconds += 1;
                updateTimer();
            }, 1000);
        });

        stopButton.addEventListener("click", () => {
            window.clearInterval(intervalId);
            intervalId = null;
            status.textContent = "Parado";
            status.classList.remove("is-running");
            startButton.disabled = false;
            stopButton.disabled = true;
        });
    </script>
    <hr>
    <a href="index01.html"><h2>Next one</h2></a>
</body>
</html>
